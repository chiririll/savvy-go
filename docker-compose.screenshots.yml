# Screenshots of every page on a throwaway app with demo data (scripts/screenshots).
#
#   docker compose -f docker-compose.screenshots.yml up --build --abort-on-container-exit --exit-code-from shots
#   docker compose -f docker-compose.screenshots.yml down -v
#
# The files are copied to ./screenshots by `npm run screenshots` (docker compose cp), which also sets
# APP_CONFIG and APP_SEED to the contents of scripts/screenshots/config.toml and seed.toml. Nothing is
# bind-mounted from the host, so this works with a remote Docker context too. `down -v` removes the
# app's data with its volume.
services:
  # Not called "app": Chromium treats http://app as the .app top-level domain, which is HTTPS-only.
  savvy:
    build:
      context: .
      args:
        APP_VERSION: screenshots
        # Marks what opens a dialog in the interface, so the runner finds it.
        APP_ENV: screenshots
    environment:
      CONFIG_FILE: /tmp/config/config.toml
      APP_CONFIG: ${APP_CONFIG:?set by npm run screenshots}
      APP_SEED: ${APP_SEED:?set by npm run screenshots}
    volumes:
      - test-data:/data
    # The config files are written from the environment, not mounted (a mount path is the daemon's).
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /tmp/config && printf '%s' "$$APP_CONFIG" > /tmp/config/config.toml && printf '%s' "$$APP_SEED" > /tmp/config/seed.toml && exec savvy-go --seed-config /tmp/config/seed.toml
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/livez"]
      interval: 3s
      timeout: 3s
      start_period: 60s
      retries: 20

  shots:
    build:
      context: .
      dockerfile: scripts/screenshots/Dockerfile
      # The app's own image: scenarios copy its binary and start it on empty data.
      additional_contexts:
        app: service:savvy
    depends_on:
      savvy:
        condition: service_healthy
    environment:
      BASE_URL: http://savvy
      MANIFEST: /data/manifest.json
      OUT: /out
      # The name of this run's directory in ./screenshots; the start time when empty.
      RUN_NAME: ${RUN_NAME:-}
      # The name of a file of scripts/screenshots/configs; the defaults when empty.
      CONFIG: ${CONFIG:-}
      # Settings from the command line (--languages=en,ru), a JSON object of strings.
      CONFIG_OVERRIDES: ${CONFIG_OVERRIDES:-}
      # Browser contexts at a time; the container's CPUs when empty.
      CONCURRENCY: ${CONCURRENCY:-}
      TZ: UTC
    # Chromium recommends sharing the host's IPC namespace in Docker.
    ipc: host
    volumes:
      - test-data:/data:ro

volumes:
  test-data:
