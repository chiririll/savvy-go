<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{.Title}}</title>
<style>
  @media (prefers-color-scheme: dark) {
    .bg { background-color: #111827 !important; }
    .card { background-color: #1f2937 !important; }
    .ink { color: #f9fafb !important; }
    .muted { color: #9ca3af !important; }
    .btn { background-color: #f9fafb !important; }
    .btn a { color: #111827 !important; }
    .rule { border-top-color: #374151 !important; }
    .link { color: #d1d5db !important; }
  }
  @media only screen and (max-width: 520px) {
    .card { padding: 24px 20px !important; }
  }
</style>
</head>
<body class="bg" style="margin:0;padding:0;background-color:#f3f4f6;">
<table role="presentation" class="bg" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f4f6;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">
        <tr>
          <td style="padding:0 0 20px 4px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding-right:12px;"><img src="cid:logo" width="40" height="40" alt="" style="display:block;border:0;border-radius:9px;"></td>
                <td class="ink" style="font-size:18px;font-weight:600;color:#1f2937;">Go Savvy</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td class="card" style="background-color:#ffffff;border-radius:12px;padding:32px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            {{template "content" .}}
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr><td class="rule" style="border-top:1px solid #e5e7eb;padding-top:16px;"><p class="muted" style="margin:0;font-size:13px;line-height:20px;color:#6b7280;">{{.Ignore}}</p></td></tr>
            </table>
          </td>
        </tr>
        <tr>
          <td class="muted" style="padding:16px 4px 0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#6b7280;">{{.Footer}}</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
