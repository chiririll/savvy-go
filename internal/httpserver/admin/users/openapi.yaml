paths:
  /users:
    get:
      tags: [Other]
      summary: List users
      description: Each user has lastActiveAt, when a session or API token of theirs was last used (null if never).
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /users/{id}:
    get:
      tags: [Other]
      summary: Get a user
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
