paths:
  /spaces/{space}/credit-cards:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Credit cards]
      summary: List credit cards
      description: >
        Each card has its terms and what they say about today: `used`, `available`, the last closed `statement`
        with its amount due and due date, and a `status` of ok, warning or danger. Nothing is charged or
        calculated: it is only shown. A card is also an account of type `credit` in `/accounts`.
      parameters:
        - {name: active, in: query, schema: {type: boolean}, description: Only active cards}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [Credit cards]
      summary: Create a credit card
      description: >
        Makes a card with its account. With `account_id` instead, an existing `bank` account becomes a card
        and keeps its payments; the other account keys are then ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id: {type: integer, description: A bank account to turn into a card}
                name: {type: string}
                currency_id: {type: integer}
                currency_code: {type: string, description: Alternative to currency_id}
                initial_balance: {type: number}
                is_active: {type: boolean}
                limit: {type: number, description: Credit limit in the account currency, above 0}
                statement_day: {type: integer, minimum: 1, maximum: 31, description: Day the billing period closes; a shorter month uses its last day}
                grace_days: {type: integer, minimum: 0, maximum: 60, description: Days from the statement to the payment due date}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "201": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/credit-cards/{id}:
    parameters: [{$ref: "#/components/parameters/Space"}, {$ref: "#/components/parameters/Id"}]
    get:
      tags: [Credit cards]
      summary: Get a credit card
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Credit cards]
      summary: Update a credit card
      description: Keys left out keep their values. The currency cannot change.
      requestBody: {$ref: "#/components/requestBodies/Object"}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
    patch:
      tags: [Credit cards]
      summary: Update a credit card
      requestBody: {$ref: "#/components/requestBodies/Object"}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
    delete:
      tags: [Credit cards]
      summary: Delete a credit card
      description: Only a card without transactions.
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
