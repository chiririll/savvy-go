paths:
  /spaces/{space}/tags:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Tags]
      summary: List tags
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [Tags]
      summary: Create a tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
      responses:
        "201": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/tags/{id}:
    parameters: [{$ref: "#/components/parameters/Space"}, {$ref: "#/components/parameters/Id"}]
    get:
      tags: [Tags]
      summary: Get a tag
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Tags]
      summary: Rename a tag
      requestBody: {$ref: "#/components/requestBodies/Object"}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
    patch:
      tags: [Tags]
      summary: Rename a tag (partial)
      requestBody: {$ref: "#/components/requestBodies/Object"}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
    delete:
      tags: [Tags]
      summary: Delete a tag
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}

