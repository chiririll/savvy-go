paths:
  /spaces/{space}/automation-rules:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Automation rules]
      summary: List automation rules
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [Automation rules]
      summary: Create a rule
      requestBody: {$ref: "#/components/requestBodies/AutomationRule"}
      responses:
        "201": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/automation-rules/triggers:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Automation rules]
      summary: Available triggers
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /spaces/{space}/automation-rules/reorder:
    parameters: [{$ref: "#/components/parameters/Space"}]
    post:
      tags: [Automation rules]
      summary: Reorder rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rules:
                  type: array
                  items:
                    type: object
                    properties:
                      id: {type: integer}
                      priority: {type: integer}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/automation-rules/{id}:
    parameters: [{$ref: "#/components/parameters/Space"}, {$ref: "#/components/parameters/Id"}]
    get:
      tags: [Automation rules]
      summary: Get a rule
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Automation rules]
      summary: Update a rule
      requestBody: {$ref: "#/components/requestBodies/AutomationRule"}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
    patch:
      tags: [Automation rules]
      summary: Update a rule (partial)
      requestBody: {$ref: "#/components/requestBodies/AutomationRule"}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
    delete:
      tags: [Automation rules]
      summary: Delete a rule
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/automation-rules/{id}/toggle:
    parameters: [{$ref: "#/components/parameters/Space"}]
    post:
      tags: [Automation rules]
      summary: Enable or disable a rule
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/automation-rules/{id}/test:
    parameters: [{$ref: "#/components/parameters/Space"}]
    post:
      tags: [Automation rules]
      summary: Test a rule against a transaction
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transaction_id: {type: integer}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/automation-rules/{id}/logs:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Automation rules]
      summary: Rule execution log
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}

