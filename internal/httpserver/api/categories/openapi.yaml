paths:
  /spaces/{space}/categories:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Categories]
      summary: List categories
      parameters:
        - {name: type, in: query, schema: {type: string, enum: [income, expense]}}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [Categories]
      summary: Create a category
      requestBody: {$ref: "#/components/requestBodies/Object"}
      responses:
        "201": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/categories-summary:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Categories]
      summary: Totals per category
      parameters:
        - {name: type, in: query, schema: {type: string, enum: [income, expense]}}
        - {name: start_date, in: query, schema: {type: string, format: date}}
        - {name: end_date, in: query, schema: {type: string, format: date}}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/categories/{id}:
    parameters: [{$ref: "#/components/parameters/Space"}, {$ref: "#/components/parameters/Id"}]
    get:
      tags: [Categories]
      summary: Get a category
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Categories]
      summary: Update a category
      requestBody: {$ref: "#/components/requestBodies/Object"}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
    patch:
      tags: [Categories]
      summary: Update a category (partial)
      requestBody: {$ref: "#/components/requestBodies/Object"}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
    delete:
      tags: [Categories]
      summary: Delete a category
      parameters:
        - {name: successor_id, in: query, schema: {type: integer}, description: Category that inherits the transactions}
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/categories/{id}/set-default:
    parameters: [{$ref: "#/components/parameters/Space"}]
    post:
      tags: [Categories]
      summary: Make this the default category
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/categories/{id}/statistics:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Categories]
      summary: Category statistics
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: start_date, in: query, schema: {type: string, format: date}}
        - {name: end_date, in: query, schema: {type: string, format: date}}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}

