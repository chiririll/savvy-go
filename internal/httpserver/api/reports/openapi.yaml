paths:
  /spaces/{space}/reports/overview:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Reports]
      summary: Overview
      parameters:
        - {name: period_type, in: query, schema: {type: string, default: last_30_days}}
        - {name: period_value, in: query, schema: {type: string}}
        - {name: start_date, in: query, schema: {type: string, format: date}}
        - {name: end_date, in: query, schema: {type: string, format: date}}
        - {name: compare_with, in: query, schema: {type: string, default: none}}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
