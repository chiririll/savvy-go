paths:
  /spaces/{space}/transactions:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Transactions]
      summary: List transactions
      parameters:
        - {name: type, in: query, schema: {type: string, enum: [income, expense, transfer]}}
        - {name: status, in: query, schema: {type: string, enum: [completed, pending, skipped]}}
        - {name: start_date, in: query, schema: {type: string, format: date}}
        - {name: end_date, in: query, schema: {type: string, format: date}}
        - {name: account_id, in: query, schema: {type: integer}}
        - {name: category_id, in: query, schema: {type: integer}}
        - {name: category_ids, in: query, schema: {type: string}, description: Comma separated ids}
        - {name: tag_ids, in: query, schema: {type: string}, description: Comma separated ids}
        - {name: sort_by, in: query, schema: {type: string}}
        - {name: sort_direction, in: query, schema: {type: string, enum: [asc, desc]}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, default: 25}}
        - {name: with_summary, in: query, schema: {type: boolean}}
      responses:
        "200":
          description: A page of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Transaction"}
                  meta:
                    type: object
                    properties:
                      current_page: {type: integer}
                      last_page: {type: integer}
                      per_page: {type: integer}
                      total: {type: integer}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [Transactions]
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransactionInput"}
      responses:
        "201": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/transactions-summary:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Transactions]
      summary: Totals for the current filter
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /spaces/{space}/transactions-pending-summary:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Transactions]
      summary: Pending (not yet confirmed) transactions summary
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /spaces/{space}/transactions/{id}:
    parameters: [{$ref: "#/components/parameters/Space"}, {$ref: "#/components/parameters/Id"}]
    get:
      tags: [Transactions]
      summary: Get a transaction
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Transactions]
      summary: Update a transaction
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransactionInput"}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
    patch:
      tags: [Transactions]
      summary: Update a transaction (partial)
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransactionInput"}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
    delete:
      tags: [Transactions]
      summary: Delete a transaction
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/transactions/{id}/duplicate:
    parameters: [{$ref: "#/components/parameters/Space"}]
    post:
      tags: [Transactions]
      summary: Duplicate a transaction
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/transactions/{id}/confirm:
    parameters: [{$ref: "#/components/parameters/Space"}]
    post:
      tags: [Transactions]
      summary: Confirm a pending transaction
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/transactions/reorder:
    parameters: [{$ref: "#/components/parameters/Space"}]
    post:
      tags: [Transactions]
      summary: Reorder transactions within one day
      description: >
        Puts the given transactions in that order on the day, oldest first.
        The ids may be only some of the day's transactions; they trade the
        places they hold. Every id must be a transaction of that day.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, ids]
              properties:
                date: {type: string, format: date}
                ids: {type: array, items: {type: integer}}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/transactions/{id}/skip:
    parameters: [{$ref: "#/components/parameters/Space"}]
    post:
      tags: [Transactions]
      summary: Skip a pending recurring transaction
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}

  /spaces/{space}/transaction-groups:
    parameters: [{$ref: "#/components/parameters/Space"}]
    post:
      tags: [Transactions]
      summary: Create a payment made in several parts
      description: >
        One payment settled with several accounts or currencies, such as cash
        and card, or euros with the change given back in dinars. It is saved as
        ordinary transactions (legs) that share a group. At least two legs, all
        confirmed, on the same day, of type expense, income or transfer. All
        legs are written or none. Money owed for the price is an expense; the
        surplus handed over and the change received are a transfer between the
        accounts, so the expense never depends on an exchange rate.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransactionGroupInput"}
      responses:
        "201": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/transaction-groups/{uuid}:
    parameters:
      - {$ref: "#/components/parameters/Space"}
      - {name: uuid, in: path, required: true, schema: {type: string}}
    get:
      tags: [Transactions]
      summary: Get a payment with its legs
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Transactions]
      summary: Replace the legs of a payment
      description: >
        Replaces all legs in one step. The legs get new ids; the payment keeps
        its uuid. A leg cannot be changed or deleted on its own through
        /transactions/{id}.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransactionGroupInput"}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
    delete:
      tags: [Transactions]
      summary: Delete a payment with all its legs
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
