paths:
  /spaces/{space}/transactions:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Transactions]
      summary: List transactions
      parameters:
        - {name: type, in: query, schema: {type: string, enum: [income, expense, transfer]}}
        - {name: status, in: query, schema: {type: string, enum: [completed, pending, skipped]}}
        - {name: start_date, in: query, schema: {type: string, format: date}}
        - {name: end_date, in: query, schema: {type: string, format: date}}
        - {name: account_id, in: query, schema: {type: integer}}
        - {name: account_ids, in: query, schema: {type: string}, description: Comma separated ids}
        - name: currency
          in: query
          schema: {type: string}
          description: >-
            Comma separated currency codes. A transfer matches when either of its accounts is in one.
        - {name: category_id, in: query, schema: {type: integer}}
        - {name: category_ids, in: query, schema: {type: string}, description: Comma separated ids}
        - {name: tag_ids, in: query, schema: {type: string}, description: Comma separated ids}
        - name: q
          in: query
          schema: {type: string, maxLength: 200}
          description: >-
            Free-text search. Space-separated terms, all of which must match. A term matches the
            description or an item name (any case, any script), and a number also matches the
            amount, the received amount of a transfer or an item price, as written in the
            currency of its account ("1879", "1 879", "18.79").
        - {name: sort_by, in: query, schema: {type: string}}
        - {name: sort_direction, in: query, schema: {type: string, enum: [asc, desc]}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, default: 25}}
        - name: count
          in: query
          schema: {type: string, enum: ["0"]}
          description: >-
            `0` skips counting every match (a slow scan on a big space). `meta.total` is then
            only what the page holds and `meta.has_more` says whether a page follows.
        - name: with_summary
          in: query
          schema: {type: boolean}
          description: >-
            Also return the confirmed income and expense totals (in the base currency) of the
            transactions that match the filters above, not only of the page.
      responses:
        "200":
          description: A page of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Transaction"}
                  meta:
                    type: object
                    properties:
                      current_page: {type: integer}
                      last_page: {type: integer}
                      per_page: {type: integer}
                      total: {type: integer}
                      has_more: {type: boolean, description: Only with count=0.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [Transactions]
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransactionInput"}
      responses:
        "201": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/transactions/bulk:
    parameters: [{$ref: "#/components/parameters/Space"}]
    post:
      tags: [Transactions]
      summary: Create many transactions
      description: >
        Creates up to 500 transactions in one request and one database transaction: all are
        stored or none. An invalid one fails the request with a message naming its position.
        Answers with the created transactions in the order sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactions]
              properties:
                transactions:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: {$ref: "#/components/schemas/TransactionInput"}
      responses:
        "201":
          description: The created transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Transaction"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/transactions-summary:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Transactions]
      summary: Totals for the current filter
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /spaces/{space}/transactions-day-totals:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Transactions]
      summary: What each day netted, per currency
      description: >-
        Income less expense per day and currency, largest first by value in the base currency. A
        transfer counts only its fee lines, skipped transactions not at all. It covers every
        transaction of the day, however long the list is. Takes the filters of the list; give
        `dates`, or both `start_date` and `end_date`.
      parameters:
        - {name: dates, in: query, schema: {type: string}, description: "Comma separated days, YYYY-MM-DD"}
        - {name: start_date, in: query, schema: {type: string, format: date}}
        - {name: end_date, in: query, schema: {type: string, format: date}}
        - {name: type, in: query, schema: {type: string, enum: [income, expense, transfer]}}
        - {name: account_ids, in: query, schema: {type: string}, description: Comma separated ids}
        - {name: currency, in: query, schema: {type: string}}
        - {name: category_ids, in: query, schema: {type: string}, description: Comma separated ids}
        - {name: tag_ids, in: query, schema: {type: string}, description: Comma separated ids}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/transactions-pending-summary:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Transactions]
      summary: Pending (not yet confirmed) transactions summary
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /spaces/{space}/transactions/{id}:
    parameters: [{$ref: "#/components/parameters/Space"}, {$ref: "#/components/parameters/Id"}]
    get:
      tags: [Transactions]
      summary: Get a transaction
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Transactions]
      summary: Update a transaction
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransactionInput"}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
    patch:
      tags: [Transactions]
      summary: Update a transaction (partial)
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransactionInput"}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
    delete:
      tags: [Transactions]
      summary: Delete a transaction
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/transactions/{id}/duplicate:
    parameters: [{$ref: "#/components/parameters/Space"}]
    post:
      tags: [Transactions]
      summary: Duplicate a transaction
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/transactions/{id}/confirm:
    parameters: [{$ref: "#/components/parameters/Space"}]
    post:
      tags: [Transactions]
      summary: Confirm a pending transaction
      description: >
        The body may carry `date`. The open occurrence of a recurring rule may also carry `payments` and `lines`
        to settle the real amounts. Confirming it makes the rule's next occurrence in the same step.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/transactions/reorder:
    parameters: [{$ref: "#/components/parameters/Space"}]
    post:
      tags: [Transactions]
      summary: Reorder transactions within one day
      description: >
        Puts the given transactions in that order on the day, oldest first.
        The ids may be only some of the day's transactions; they trade the
        places they hold. Every id must be a transaction of that day.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, ids]
              properties:
                date: {type: string, format: date}
                ids: {type: array, items: {type: integer}}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/transactions/{id}/skip:
    parameters: [{$ref: "#/components/parameters/Space"}]
    post:
      tags: [Transactions]
      summary: Skip a pending recurring transaction
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
