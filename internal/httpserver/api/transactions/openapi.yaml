paths:
  /spaces/{space}/transactions:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Transactions]
      summary: List transactions
      parameters:
        - {name: type, in: query, schema: {type: string, enum: [income, expense, transfer]}}
        - {name: status, in: query, schema: {type: string, enum: [completed, pending, skipped]}}
        - {name: start_date, in: query, schema: {type: string, format: date}}
        - {name: end_date, in: query, schema: {type: string, format: date}}
        - {name: account_id, in: query, schema: {type: integer}}
        - {name: account_ids, in: query, schema: {type: string}, description: Comma separated ids}
        - name: currency
          in: query
          schema: {type: string}
          description: >-
            Comma separated currency codes. A transfer matches when either of its accounts is in one.
        - {name: category_id, in: query, schema: {type: integer}}
        - {name: category_ids, in: query, schema: {type: string}, description: Comma separated ids}
        - {name: tag_ids, in: query, schema: {type: string}, description: Comma separated ids}
        - name: q
          in: query
          schema: {type: string, maxLength: 200}
          description: >-
            Free-text search. Space-separated terms, all of which must match. A term matches the
            description or an item name (any case, any script), and a number also matches the
            amount, the received amount of a transfer or an item price, as written in the
            currency of its account ("1879", "1 879", "18.79").
        - {name: sort_by, in: query, schema: {type: string}}
        - {name: sort_direction, in: query, schema: {type: string, enum: [asc, desc]}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, default: 25}}
        - name: with_summary
          in: query
          schema: {type: boolean}
          description: >-
            Also return the confirmed income and expense totals (in the base currency) of the
            transactions that match the filters above, not only of the page.
      responses:
        "200":
          description: A page of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Transaction"}
                  meta:
                    type: object
                    properties:
                      current_page: {type: integer}
                      last_page: {type: integer}
                      per_page: {type: integer}
                      total: {type: integer}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [Transactions]
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransactionInput"}
      responses:
        "201": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/transactions-summary:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Transactions]
      summary: Totals for the current filter
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /spaces/{space}/transactions-pending-summary:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Transactions]
      summary: Pending (not yet confirmed) transactions summary
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /spaces/{space}/transactions/{id}:
    parameters: [{$ref: "#/components/parameters/Space"}, {$ref: "#/components/parameters/Id"}]
    get:
      tags: [Transactions]
      summary: Get a transaction
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Transactions]
      summary: Update a transaction
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransactionInput"}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
    patch:
      tags: [Transactions]
      summary: Update a transaction (partial)
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransactionInput"}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
    delete:
      tags: [Transactions]
      summary: Delete a transaction
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/transactions/{id}/duplicate:
    parameters: [{$ref: "#/components/parameters/Space"}]
    post:
      tags: [Transactions]
      summary: Duplicate a transaction
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/transactions/{id}/confirm:
    parameters: [{$ref: "#/components/parameters/Space"}]
    post:
      tags: [Transactions]
      summary: Confirm a pending transaction
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/transactions/{id}/skip:
    parameters: [{$ref: "#/components/parameters/Space"}]
    post:
      tags: [Transactions]
      summary: Skip a pending recurring transaction
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}

