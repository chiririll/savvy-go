paths:
  /spaces/{space}/recurring:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Recurring]
      summary: List recurring transactions
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [Recurring]
      summary: Create a recurring transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecurringInput"}
      responses:
        "201": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Validation"}
  /spaces/{space}/recurring-upcoming:
    parameters: [{$ref: "#/components/parameters/Space"}]
    get:
      tags: [Recurring]
      summary: Upcoming runs
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /spaces/{space}/recurring/{id}:
    parameters: [{$ref: "#/components/parameters/Space"}, {$ref: "#/components/parameters/Id"}]
    get:
      tags: [Recurring]
      summary: Get a recurring transaction
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Recurring]
      summary: Update a recurring transaction
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecurringInput"}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
    patch:
      tags: [Recurring]
      summary: Update a recurring transaction (partial)
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecurringInput"}
      responses:
        "200": {$ref: "#/components/responses/Data"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
    delete:
      tags: [Recurring]
      summary: Delete a recurring transaction
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}

