name: Build dist tarball and deb

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dist-release
  cancel-in-progress: false

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Push a v* tag to build a release (git tag v1.2.3 && git push origin v1.2.3)"
            exit 1
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Compose release notes
        env:
          REPO: ${{ github.repository }}
        run: |
          {
            if [ -s CHANGES.md ]; then
              cat CHANGES.md
              echo
            else
              echo "Savvy ${{ steps.ver.outputs.tag }}"
              echo
            fi
            echo "---"
            echo
            echo "Tarball: \`https://github.com/${REPO}/releases/latest/download/savvy.tar.gz\`"
            echo
            echo "Debian:"
            echo
            echo '```bash'
            echo "curl -fsSLO https://github.com/${REPO}/releases/latest/download/savvy.deb"
            echo "sudo apt install ./savvy.deb"
            echo '```'
          } > RELEASE_NOTES.md
          echo "::group::Release notes"
          cat RELEASE_NOTES.md
          echo "::endgroup::"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build Go binary
        env:
          APP_VERSION: ${{ steps.ver.outputs.tag }}
          APP_ENV: production
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X github.com/chiririll/savvy-plus/internal/version.Value=${APP_VERSION} -X github.com/chiririll/savvy-plus/internal/version.Env=${APP_ENV}" \
            -o dist/savvy ./cmd/savvy

      - name: Build frontend
        env:
          APP_VERSION: ${{ steps.ver.outputs.tag }}
        run: npm ci && npm run build

      - name: Package tarball
        env:
          APP_VERSION: ${{ steps.ver.outputs.tag }}
        run: bash deploy/common/package-dist.sh

      - name: Install nfpm
        env:
          NFPM_VERSION: "2.47.0"
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Package deb
        env:
          APP_VERSION: ${{ steps.ver.outputs.tag }}
        run: bash deploy/deb/package-deb.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: |
            dist/savvy.tar.gz
            dist/*.deb
          body_path: RELEASE_NOTES.md
