name: Build deb and rpm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dist-release
  cancel-in-progress: false

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Push a v* tag to build a release (git tag v1.2.3 && git push origin v1.2.3)"
            exit 1
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Compose release notes
        run: |
          if [ -s CHANGES.md ]; then
            cp CHANGES.md RELEASE_NOTES.md
          else
            echo "Savvy ${{ steps.ver.outputs.tag }}" > RELEASE_NOTES.md
          fi
          echo "::group::Release notes"
          cat RELEASE_NOTES.md
          echo "::endgroup::"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install nfpm
        env:
          NFPM_VERSION: "2.47.0"
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"             | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version

      # Frontend, Linux and Windows binaries with it embedded, deb, rpm and SHA256SUMS into dist/.
      - name: Build release
        env:
          APP_VERSION: ${{ steps.ver.outputs.tag }}
        run: npm ci && go tool mage release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/savvy-go-linux-amd64
            dist/savvy-go-windows-amd64.exe
            dist/SHA256SUMS
          body_path: RELEASE_NOTES.md
