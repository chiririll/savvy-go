name: CI Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    name: Test deb and rpm service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, package and test in a systemd container
        run: go tool mage test:packages
