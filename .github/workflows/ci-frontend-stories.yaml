name: Stories Matrix

# Every story again in the other languages (phone size) and in the dark theme. CI Frontend runs English and light only.
# Manual only: start it with "Run workflow" on the Actions tab.
# One runner per vitest project, so the projects run in parallel and never share a browser.
on:
  workflow_dispatch:

jobs:
  projects:
    name: List projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@v4

      - name: List story projects
        id: list
        run: echo "projects=$(node scripts/test-stories-full.mjs --list)" >> "$GITHUB_OUTPUT"

  stories-matrix:
    name: ${{ matrix.project }}
    needs: projects
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.projects.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browser for stories
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Story tests, ${{ matrix.project }}
        run: npx vitest run --project ${{ matrix.project }}
