name: CI Go integration

# HTTP server tests (build tag `integration`). Slow, so run on demand only.
on:
  workflow_dispatch:

jobs:
  integration:
    name: Go integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'

      - name: Test
        run: go test -tags integration ./internal/httpserver
