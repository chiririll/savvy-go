name: CI Frontend

on:
  pull_request:
    branches: [main]
    paths:
      - 'resources/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.storybook/**'
      - 'components.json'
      - '.github/workflows/ci-frontend.yaml'
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.storybook/**'
      - 'components.json'
      - '.github/workflows/ci-frontend.yaml'
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.ci.json

      - name: Test
        run: npm test

      - name: Install browser for stories
        run: npx playwright install --with-deps chromium

      - name: Story tests
        run: npm run test:stories

  # Every story again in the other languages (phone size) and in the dark theme. The job above runs English and light only.
  stories-matrix:
    name: Story language and theme matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser for stories
        run: npx playwright install --with-deps chromium

      - name: Story tests, every language and theme
        run: npm run test:stories:full
