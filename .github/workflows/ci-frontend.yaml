name: CI Frontend

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths: &frontend-paths
      - 'resources/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'vitest.stories.config.ts'
      - '.storybook/**'
      - 'components.json'
      - '.github/workflows/ci-frontend.yaml'
  push:
    branches: [main]
    paths: *frontend-paths
  workflow_dispatch:

jobs:
  checks:
    name: Type check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.ci.json

      - name: Test
        run: npm test
