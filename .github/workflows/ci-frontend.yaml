name: CI Frontend

on:
  pull_request:
    branches: [main]
    paths:
      - 'resources/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'components.json'
      - '.github/workflows/ci-frontend.yaml'
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'components.json'
      - '.github/workflows/ci-frontend.yaml'
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.ci.json

      - name: Test
        run: npm test
