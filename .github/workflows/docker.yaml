name: Build and Push to Docker Hub

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    # Opt-in: set repo variable DOCKER_IMAGE (e.g. user/savvy-go) and secrets
    # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN. Without the variable the job is skipped.
    if: vars.DOCKER_IMAGE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Get version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

      # Scan before pushing: a failing scan blocks the publish.
      - name: Build image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: savvy-go:scan
          platforms: linux/amd64
          cache-from: type=gha
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_ENV=production

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: savvy-go:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_ENV=production
