services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_ENV: ${APP_ENV:-production}
    environment:
      APP_URL: ${APP_URL:-http://localhost:8081}
      SEED_DEMO: ${SEED_DEMO:-false}
    ports:
      - "8081:80"
    volumes:
      - data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/livez"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 3

volumes:
  data:
