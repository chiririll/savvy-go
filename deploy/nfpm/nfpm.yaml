# Shared by deb, rpm and apk; built by `mage package:deb`, `package:rpm` and `package:apk`.
# Env: APP_VERSION. @APP_USER@ (service account) is substituted by the script.
name: savvy-go
arch: amd64
platform: linux
version: ${APP_VERSION}
version_schema: semver
release: "1"
section: web
priority: optional
maintainer: Kirill Chizhov <sstive39@gmail.com>
homepage: https://github.com/chiririll/savvy-go
license: MIT
description: |-
  Selfhosted expense tracker with spaces and multi-currency support.
  .
  Installs the Go Savvy binary (the web UI is built in) and a service.
  SQLite data lives in /var/lib/savvy-go, the config in /etc/savvy-go/config.toml.

contents:
  - src: ../../dist/savvy-go
    dst: /usr/bin/savvy-go
    file_info:
      mode: 0755
  - src: ../../dist/stage/savvy-go.service
    dst: /usr/lib/systemd/system/savvy-go.service
    packager: deb
  - src: ../../dist/stage/savvy-go.service
    dst: /usr/lib/systemd/system/savvy-go.service
    packager: rpm
  # Alpine runs OpenRC, not systemd.
  - src: ../../dist/stage/savvy-go.initd
    dst: /etc/init.d/savvy-go
    packager: apk
    file_info:
      mode: 0755
  - dst: /etc/savvy-go
    type: dir
    file_info:
      mode: 0750
      owner: "@APP_USER@"
      group: "@APP_USER@"
  - dst: /var/lib/savvy-go
    type: dir
    file_info:
      mode: 0775
      owner: "@APP_USER@"
      group: "@APP_USER@"

overrides:
  deb:
    depends:
      - adduser
    scripts:
      postinstall: deb/postinst
      preremove: deb/prerm
      postremove: deb/postrm
  apk:
    scripts:
      preinstall: apk/preinst
      postinstall: apk/postinst
      preremove: apk/prerm
  rpm:
    scripts:
      preinstall: rpm/preinst
      postinstall: rpm/postinst
      preremove: rpm/prerm
      postremove: rpm/postrm

# Only apk has a separate upgrade hook; the others get $1 in the install scripts.
apk:
  scripts:
    postupgrade: apk/postupgrade
