# Shared by deb and rpm; built via package-linux.sh.
# Env: APP_VERSION. @APP_USER@ (service account) is substituted by the script.
name: savvy-go
arch: amd64
platform: linux
version: ${APP_VERSION}
version_schema: semver
release: "1"
section: web
priority: optional
maintainer: Kirill Chizhov <sstive39@gmail.com>
homepage: https://github.com/chiririll/savvy-go
license: MIT
description: |-
  Selfhosted expense tracker with multi-currency support.
  .
  Installs the Go Savvy binary, static SPA assets, and a systemd unit.
  SQLite data lives in /var/lib/savvy-go, the config in /etc/savvy-go/config.toml.

contents:
  - src: ../../dist/savvy-go
    dst: /usr/bin/savvy-go
    file_info:
      mode: 0755
  - src: ../../dist/public
    dst: /usr/share/savvy-go/public
    type: tree
  - src: ../../dist/stage/savvy-go.service
    dst: /usr/lib/systemd/system/savvy-go.service
  - dst: /etc/savvy-go
    type: dir
    file_info:
      mode: 0750
      owner: "@APP_USER@"
      group: "@APP_USER@"
  - dst: /var/lib/savvy-go
    type: dir
    file_info:
      mode: 0775
      owner: "@APP_USER@"
      group: "@APP_USER@"

overrides:
  deb:
    depends:
      - adduser
    scripts:
      postinstall: deb/postinst
      preremove: deb/prerm
      postremove: deb/postrm
  rpm:
    scripts:
      preinstall: rpm/preinst
      postinstall: rpm/postinst
      preremove: rpm/prerm
      postremove: rpm/postrm
