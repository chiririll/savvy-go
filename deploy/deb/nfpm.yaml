name: savvy
arch: amd64
platform: linux
version: ${APP_VERSION}
version_schema: semver
release: "1"
section: web
priority: optional
maintainer: Kirill Chizhov <sstive39@gmail.com>
homepage: https://github.com/chiririll/savvy-plus
license: MIT
description: |-
  Selfhosted expense tracker with multi-currency support.
  .
  Installs the Savvy Go binary, static SPA assets, and a systemd unit.
  SQLite data lives in /var/lib/savvy.

depends:
  - adduser

contents:
  - src: ../../dist/savvy
    dst: /usr/bin/savvy
    file_info:
      mode: 0755
  - src: ../../dist/public
    dst: /opt/savvy/public
    type: tree
  - src: savvy.service
    dst: /usr/lib/systemd/system/savvy.service
  - src: install.env
    dst: /etc/savvy/install.env
    type: config
  - dst: /var/lib/savvy
    type: dir
    file_info:
      mode: 0775
      owner: www-data
      group: www-data

scripts:
  postinstall: postinst
  preremove: prerm
  postremove: postrm
